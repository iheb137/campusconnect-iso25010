spring.application.name=backend

# Port HTTP du backend (8080 est souvent pris par Jenkins ou Tomcat)
server.port=${SERVER_PORT:8280}

# Connexion PostgreSQL : les valeurs viennent de variables d'environnement.
# Le mot de passe n'a volontairement AUCUNE valeur par défaut.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:campusconnect_qa}
spring.datasource.username=${DB_USERNAME:campusconnect_user}
spring.datasource.password=${DB_PASSWORD}

# Fiabilité : si PostgreSQL ne répond pas, échec rapide (503) au lieu d'attendre 30 s
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

# Compte administrateur créé au démarrage (valeurs vides = pas de création)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Compte modérateur créé au démarrage (valeurs vides = pas de création)
app.moderator.email=${MODERATOR_EMAIL:}
app.moderator.password=${MODERATOR_PASSWORD:}

# Données de démonstration (0 = désactivé). Exemple : DEMO_REQUESTS=2000
app.demo.requests=${DEMO_REQUESTS:0}

# Jetons JWT : la clé secrète n'a AUCUNE valeur par défaut (32 caractères minimum)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
# Sécurité : blocage après plusieurs échecs de connexion sur un même email (RG-13)
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}

# Erreurs : jamais de trace technique ni de message interne dans les réponses
server.error.include-stacktrace=never
server.error.include-message=never
